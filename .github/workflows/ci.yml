name: CI — Test & Lint

on:
  push:
    branches: [develop, 'feat/**']
  pull_request:
    branches: [develop]

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sitelens
          POSTGRES_PASSWORD: sitelens
          POSTGRES_DB: sitelens_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sitelens:sitelens@localhost:5432/sitelens_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Run tests
        run: npm test
